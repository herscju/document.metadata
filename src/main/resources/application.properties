### Development tools ---------------------------------------------------------
spring.devtools.livereload.enabled = false


### EHCache settings ----------------------------------------------------------
# Configuring ehcache.xml  
spring.cache.jcache.config = classpath:./ehcache.xml


### Configure the ActiveMQ connection -----------------------------------------
spring.activemq.broker-url = tcp://artemis.hersche.name:61616
spring.activemq.close-timeout = 15000
spring.activemq.in-memory = true
spring.activemq.non-blocking-redelivery = false
spring.activemq.user = admin
spring.activemq.password = admin
spring.activemq.send-timeout = 0
spring.activemq.packages.trust-all = false
spring.activemq.packages.trusted = info.hersche.document
spring.activemq.pool.block-if-full = true
spring.activemq.pool.block-if-full-timeout = -1
spring.activemq.pool.create-connection-on-startup = true
spring.activemq.pool.enabled = false
spring.activemq.pool.expiry-timeout = 0
spring.activemq.pool.idle-timeout = 30000
spring.activemq.pool.max-connections = 1
spring.activemq.pool.max-sessions-per-connection = 500
spring.activemq.pool.reconnect-on-exception = true
spring.activemq.pool.time-between-expiration-check = -1
spring.activemq.pool.use-anonymous-producers = true

# Spring JMS Settings
spring.jms.jndi-name = HerscheMetadata
spring.jms.listener.session.acknowledge-mode = auto
spring.jms.listener.auto-startup = true
spring.jms.listener.min-concurrency = 5
spring.jms.listener.max-concurrency = 10
spring.jms.pub-sub-domain = false
spring.jms.template.default-destination = empty
spring.jms.template.delivery-mode = non-persistent
spring.jms.template.priority = 100
spring.jms.template.qos-enabled = true
spring.jms.template.receive-timeout = 1000
spring.jms.template.time-to-live = 36000


### Configure JPA, Datasource and H2 ------------------------------------------
### H2 DataSource properties
spring.h2.console.enabled = true
spring.h2.console.path = /h2
spring.datasource.url = jdbc:h2:mem:blog_database;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.url = jdbc:h2:~/test
spring.datasource.username = sa
spring.datasource.password =
spring.datasource.driver-class-name = org.h2.Driver
# Fixes encoding problem then loading lithuanian characters from file
spring.sql.init.encoding = UTF-8
spring.sql.init.platform = h2
spring.sql.init.schema-locations = classpath:./sql/schema.sql
spring.sql.init.data-locations = classpath:./sql/data.sql
#spring.jpa.generate-ddl = false

#spring.profiles.active = dev
#spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.hibernate.ddl-auto = update
#spring.profiles.active = prod
#spring.jpa.hibernate.ddl-auto = validate
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.open-in-view = false


### Web page settings ---------------------------------------------------------
# https://stackoverflow.com/a/41319170
# https://stackoverflow.com/a/42581812
# Template mode to be applied to templates.
spring.thymeleaf.mode = HTML
# Template files encoding.
spring.thymeleaf.encoding = UTF-8
# Check that the template exists before rendering it.
spring.thymeleaf.check-template = true
# Check that the templates location exists.
spring.thymeleaf.check-template-location = true
# Enable MVC Thymeleaf view resolution.
spring.thymeleaf.enabled = true
# Prefix that gets prepended to view names when building a URL.
spring.thymeleaf.prefix = classpath:./templates/
# Suffix that gets appended to view names when building a URL.
spring.thymeleaf.suffix = .html
# Whether to enable template caching.
spring.thymeleaf.cache = false


### Actuator / info -----------------------------------------------------------
info.application.name = @project.name@
info.application.groupId = @project.groupId@
info.application.artifactId = @project.artifactId@
info.application.version = @project.version@
info.application.description = @project.description@


### Actuator settings ---------------------------------------------------------
management.endpoints.web.base-path = /details
management.endpoints.web.exposure.include = *
management.endpoint.health.show-details = always


### Hawtio settings -----------------------------------------------------------
hawtio.authenticationEnabled = false


## Security (Waffle / SSO) ----------------------------------------------------
waffle.sso.enabled = true
waffle.sso.basicEnabled = true
waffle.principalFormat = fqn
waffle.roleFormat = both
waffle.allowGuestLogin = false
waffle.impersonate = true
waffle.protocols = Negotiate, NTLM

waffle.disableSSO = false
waffle.excludeCorsPreflight = true
waffle.excludeBearerAuthorization = true
waffle.excludePatterns = /api*
waffle.realm = Green@rtServices


### OpenAPI / Swagger ---------------------------------------------------------
# swagger-ui custom path
springdoc.swagger-ui.path = /openapi.html


