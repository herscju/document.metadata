### Core settings -------------------------------------------------------------
debug = false
logging.level.com.github.dblock.waffle = OFF
logging.level.org.apache = OFF
logging.level.org.apache.catalina = OFF
logging.level.org.apache.tomcat = OFF
logging.level.org.springframework.security = OFF
logging.level.waffle = OFF
logging.level.web = OFF


## Profile settings -----------------------------------------------------------
spring.profiles.active = @spring.profiles.active@
spring.config.import = optional:file:./custom.properties

### General server settings ---------------------------------------------------
spring.application.admin.enabled = false
spring.application.name = @project.name@

spring.main.banner-mode = console
spring.banner.location = classpath:./banner.txt

server.error.path = /error
server.error.whitelabel.enabled = false
server.error.include-message = always
server.error.include-binding-errors = always
server.error.include-stacktrace = on-param
server.error.include-exception = false

# Port 8080 is used by the AgentService (MiniTool partition Wizard)
server.http.port = 8081
server.address = artemis.hersche.name
server.port = 8443
server.ssl.enabled = true
server.http2.enabled = true

server.servlet.context-path = /

# See 'https://stackoverflow.com/a/70632039/6487382'
server.servlet.encoding.charset = UTF-8
server.servlet.encoding.force = true

# See 'https://stackoverflow.com/a/33233088'
# Max file size.
spring.servlet.multipart.max-file-size = 64MB
# Max request size.
spring.servlet.multipart.max-request-size = 640MB
# Whether to resolve the multipart request lazily at the time of file or parameter access.
spring.servlet.multipart.resolve-lazily = true

# See 'https://stackoverflow.com/a/54405341/6487382'
server.tomcat.max-swallow-size = 640MB

# See 'https://stackoverflow.com/a/70028532/6487382'
server.tomcat.uri-encoding = UTF-8


