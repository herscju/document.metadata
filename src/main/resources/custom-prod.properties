## Application specific settings ----------------------------------------------
## See https://stackoverflow.com/a/27013249
## See https://www.baeldung.com/properties-with-spring


## General
spring.config.activate.on-profile = @spring.profiles.active@

application.custom.domain = HERSCHE


### Application settings ------------------------------------------------------
application.file.upload.daemon = true
application.file.upload.pollInterval = 5
application.file.upload.quietPeriod = 1
application.file.upload.directory = upload

application.file.download.daemon = true
application.file.download.pollInterval = 5
application.file.download.quietPeriod = 1
application.file.download.directory = download

application.hosts.host.protocol = https
application.hosts.host.name = artemis.hersche.name
application.hosts.host.port = 8443
application.hosts.host.wiki = ${application.hosts.host.protocol}://${application.hosts.host.name}:${application.hosts.host.port}/wiki

application.hosts.ldap.protocol = ldaps
application.hosts.ldap.name = kassandra.hersche.name
application.hosts.ldap.port = 636

application.chats.stomp.protocol = wss
application.chats.stomp.name = ${application.hosts.host.name}
application.chats.stomp.port = ${application.hosts.host.port}
application.chats.stomp.push = ${application.chats.stomp.protocol}://${application.hosts.host.name}:${application.hosts.host.port}/push

application.keys.google = AIzaSyBJeArNSSD7ow5qnilV9sx4_mdHyHpHTrU
application.keys.osm = 

application.activemq.queue.document.name = info-hersche-document-document-queue
application.activemq.queue.standard.name = info-hersche-standard-document-queue
application.activemq.queue.whatsapp.name = info-hersche-whatsapp-document-queue
application.activemq.queue.lightbox.name = info-hersche-lightbox-document-queue
application.ehcache.name = MetaDataCache

# Max. file size in MB
application.dropzone.acceptedFiles = tbd
application.dropzone.addRemoveLinks = true
application.dropzone.autoProcessQueue = true
application.dropzone.autoQueue = true
application.dropzone.capture = 
application.dropzone.clickable = true
application.dropzone.chunking = false
application.dropzone.chunkSize = 2000000
application.dropzone.createImageThumbnails = true
application.dropzone.dictDefaultMessage = 
application.dropzone.disablePreviews = false
application.dropzone.filesizeBase = 1000
application.dropzone.forceChunking = false
#application.dropzone.headers = 
application.dropzone.hiddenInputContainer = body
application.dropzone.ignoreHiddenFiles = true
application.dropzone.maxFiles = 
application.dropzone.maxFilesize = 64
application.dropzone.maxThumbnailFilesize = 16
application.dropzone.parallelChunkUploads = false
application.dropzone.parallelUploads = 1
application.dropzone.paramName = file
application.dropzone.previewsContainer = 
application.dropzone.renameFile = 
application.dropzone.resizeHeight = 
application.dropzone.resizeMimeType = image/jpeg
application.dropzone.resizeWidth = 
application.dropzone.resizeMethod = contain
application.dropzone.resizeQuality = 1
application.dropzone.retryChunks = false
application.dropzone.retryChunksLimit = false
application.dropzone.timeout = 0
application.dropzone.thumbnailHeight = 120
application.dropzone.thumbnailMethod = crop
application.dropzone.thumbnailWidth = 120
application.dropzone.uploadMultiple = false
application.dropzone.withCredentials = true
application.dropzone.forceFallback = false


